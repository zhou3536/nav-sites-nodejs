<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link</title>
  <link rel="stylesheet" href="sty.css">
</head>

<body>

  <header>
    <div class="search-wrap">
      <!-- <div class="engine-pills">
        <button class="pill active" data-engine="bing">Bing</button>
        <button class="pill" data-engine="google">Google</button>
        <button class="pill" data-engine="baidu">Baidu</button>
      </div> -->
      <div class="search-box">
        <div class="engine-pill" id="engine-pill"></div>
        <div class="engine-pills" id="engine-pills"></div>
        <input id="search-input" type="text" placeholder="搜索…" autocomplete="off">
        <ul id="suggestion-list" class="suggestion-list"></ul>
        <button id="clean-btn">×</button>
        <button id="search-btn"></button>
      </div>

    </div>
  </header>

  <main class="container">
    <div id="bookmarks-grid"></div>
  </main>

  <!-- Modal -->
  <div id="modal-overlay">
    <div id="modal">
      <h2 id="modal-title">添加网站</h2>
      <div class="field">
        <label>名称</label>
        <input id="modal-name" type="text" placeholder="输入名称">
      </div>
      <div class="field">
        <label>网址</label>
        <input id="modal-url" type="text" placeholder="输入网址">
      </div>
      <div class="field">
        <label class="checkbox-label" for="uploadIcon">
          <input id="uploadIcon" type="checkbox" checked>
          <span>上传图标</span>
        </label>
      </div>
      <div id="manual-icon-section" class="manual-icon-section">
        <div class="icon-upload-bar">
          <input id="modal-icon-file" type="file" accept="image/*" hidden>
          <button type="button" class="btn btn-ghost btn-sm" id="modal-icon-pick">选择图片</button>
          <!-- <span class="icon-size-hint">固定输出 128 × 128</span> -->
        </div>
        <div id="cropper-workspace" class="cropper-workspace">
          <div class="cropper-stage">
            <img id="cropper-img" alt="待裁剪图标">
          </div>
          <div class="cropper-preview-wrap">
            <div id="cropper-preview" class="cropper-preview"></div>
            <span class="preview-label">128×128 预览</span>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script src="cropper.js"></script>
  <script src="loader.js"></script>
  <script src="context-menu.js"></script>
  <script src="main.js"></script>

</body>

</html>
