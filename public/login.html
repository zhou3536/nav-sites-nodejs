<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, sans-serif;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
    }

    h1 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 28px;
      text-align: center;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #666;
    }

    button {
      width: 100%;
      padding: 11px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #eee;
    }

    .error {
      color: #f55;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>登录</h1>
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    <button onclick="login()">登 录</button>
    <div class="error" id="error"></div>
  </div>
  <script>
    async function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      document.getElementById("error").textContent = "";

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (data.success && window.location.pathname === '/login') {
        window.location.href = "/";
      } else if (data.success) {
        location.reload();
      } else {
        document.getElementById("error").textContent = data.message;
      }
    }

    document.addEventListener("keydown", e => e.key === "Enter" && login());
  </script>
</body>

</html>
